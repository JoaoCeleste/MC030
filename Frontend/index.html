<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unicamp Map Game</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #000; }
    #map { height: 100vh; width: 100vw; }
    .joystick {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .stick {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="joystick" id="joystick">
    <div class="stick" id="stick"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const movementSpeed = 0.0000002; // Adjust this value to control movement speed

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-22.817, -47.068], 17);

    L.tileLayer('https://cartodb-basemaps-a.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: ''
    }).addTo(map);

    let playerPos = [-22.817, -47.068];
    const playerMarker = L.marker(playerPos).addTo(map);

    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    let centerX, centerY, movementX = 0, movementY = 0;

    function updatePlayerPosition() {
      if (movementX !== 0 || movementY !== 0) {
        playerPos[0] += -movementY * movementSpeed;
        playerPos[1] += movementX * movementSpeed;
        playerMarker.setLatLng(playerPos);
        map.setView(playerPos);
      }
      requestAnimationFrame(updatePlayerPosition);
    }

    function startInput(clientX, clientY) {
      const rect = joystick.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
      centerY = rect.top + rect.height / 2;
      moveInput(clientX, clientY);
    }

    function moveInput(clientX, clientY) {
      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
      const angle = Math.atan2(dy, dx);
      const offsetX = dist * Math.cos(angle);
      const offsetY = dist * Math.sin(angle);
      stick.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      movementX = offsetX;
      movementY = offsetY;
    }

    function endInput() {
      stick.style.transform = 'translate(0,0)';
      movementX = 0;
      movementY = 0;
    }

    joystick.addEventListener('touchstart', e => startInput(e.touches[0].clientX, e.touches[0].clientY));
    joystick.addEventListener('touchmove', e => { e.preventDefault(); moveInput(e.touches[0].clientX, e.touches[0].clientY); });
    joystick.addEventListener('touchend', endInput);

    joystick.addEventListener('mousedown', e => { e.preventDefault(); startInput(e.clientX, e.clientY); document.addEventListener('mousemove', mouseMove); document.addEventListener('mouseup', mouseUp); });

    function mouseMove(e) { moveInput(e.clientX, e.clientY); }
    function mouseUp() { endInput(); document.removeEventListener('mousemove', mouseMove); document.removeEventListener('mouseup', mouseUp); }

    updatePlayerPosition();
  </script>
</body>
</html>
