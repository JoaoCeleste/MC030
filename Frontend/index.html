<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unicamp Map Game</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #000; }
    #map { height: 100vh; width: 100vw; }
    .joystick {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .stick {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      position: relative;
    }
    #quizModal {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 20px;
      border-radius: 12px;
      z-index: 2000;
      width: 300px;
    }
    #quizOptions button {
      display: block;
      margin: 5px 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="joystick" id="joystick">
    <div class="stick" id="stick"></div>
  </div>
  <div id="medals" style="position:fixed; top:20px; right:20px; 
  background:rgba(255,255,255,0.8); padding:10px; border-radius:12px; 
  z-index:1500; display:flex; flex-wrap:wrap; gap:5px; max-width:150px;">
    <h4 style="margin:0 0 5px 0; width:100%;">Medals</h4>
  </div>


  <div id="quizModal">
    <h2 id="quizTitle"></h2>
    <p id="quizQuestion"></p>
    <div id="quizOptions"></div>
    <button onclick="closeQuiz()">Close</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-22.817, -47.068], 17);

    L.tileLayer('https://cartodb-basemaps-a.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: ''
    }).addTo(map);

    let playerPos = [-22.817, -47.068];
    const playerMarker = L.marker(playerPos).addTo(map);

    // Custom red icon for gyms
    const gymIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.3/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Gyms (starting with IFGW)
    const gyms = [
      {
        name: "IFGW - Instituto de Física",
        coords: [-22.817519201512976, -47.067349571393784],
        medal: "🔭 Medalha de Física",
        quiz: [
          {
            q: "What is the speed of light in vacuum?",
            options: ["3 x 10^8 m/s", "1.5 x 10^7 m/s", "9.8 m/s^2"],
            answer: 0
          }
        ]
      },
      
      {
        name: "IMECC - Instituto de Matemática e Ciência da Computação",
        coords: [-22.81577381481928, -47.067741816556705],
        medal: " Medalha de Matemática",
        quiz: [
          {
            q: "What is the speed of light in vacuum?",
            options: ["3 x 10^8 m/s", "1.5 x 10^7 m/s", "9.8 m/s^2"],
            answer: 0
          }
        ]
      }

    ];

    gyms.forEach(gym => {
      const marker = L.marker(gym.coords, { icon: gymIcon }).addTo(map).bindTooltip(gym.name);
      marker.on("click", () => openQuiz(gym));
    });

    // Quiz logic
    function openQuiz(gym) {
      document.getElementById("quizModal").style.display = "block";
      document.getElementById("quizTitle").textContent = gym.name;
      const q = gym.quiz[0];
      document.getElementById("quizQuestion").textContent = q.q;
      const optionsDiv = document.getElementById("quizOptions");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          if (i === q.answer) {
            alert("Correct! 🏅 You won the " + gym.medal + "!");
            awardMedal(gym.medal);
          } else {
            alert("Wrong answer ❌ Try again!");
          }
        };
        optionsDiv.appendChild(btn);
      });
    }

    function closeQuiz() {
      document.getElementById("quizModal").style.display = "none";
    }

    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    let centerX, centerY, movementX = 0, movementY = 0;
    const movementSpeed = 0.0000001; // adjust speed here

    function updatePlayerPosition() {
      if (movementX !== 0 || movementY !== 0) {
        playerPos[0] += -movementY * movementSpeed;
        playerPos[1] += movementX * movementSpeed;
        playerMarker.setLatLng(playerPos);
        map.setView(playerPos);
      }
      requestAnimationFrame(updatePlayerPosition);
    }

    function startInput(clientX, clientY) {
      const rect = joystick.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
      centerY = rect.top + rect.height / 2;
      moveInput(clientX, clientY);
    }

    function moveInput(clientX, clientY) {
      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
      const angle = Math.atan2(dy, dx);
      const offsetX = dist * Math.cos(angle);
      const offsetY = dist * Math.sin(angle);
      stick.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      movementX = offsetX;
      movementY = offsetY;
    }

    function endInput() {
      stick.style.transform = 'translate(0,0)';
      movementX = 0;
      movementY = 0;
    }

    let earnedMedals = [];
    function awardMedal(medal) {
      if (!earnedMedals.includes(medal)) {
        earnedMedals.push(medal);
        updateMedalsDisplay();
      }
    }

    function updateMedalsDisplay() {
      const medalDiv = document.getElementById("medals");
      medalDiv.innerHTML = "<h4 style='margin:0 0 5px 0; width:100%;'>Medals</h4>";
      earnedMedals.forEach(medal => {
        const span = document.createElement("span");
        span.textContent = medal;
        medalDiv.appendChild(span);
      });
}


    joystick.addEventListener('touchstart', e => startInput(e.touches[0].clientX, e.touches[0].clientY));
    joystick.addEventListener('touchmove', e => { e.preventDefault(); moveInput(e.touches[0].clientX, e.touches[0].clientY); });
    joystick.addEventListener('touchend', endInput);

    joystick.addEventListener('mousedown', e => { e.preventDefault(); startInput(e.clientX, e.clientY); document.addEventListener('mousemove', mouseMove); document.addEventListener('mouseup', mouseUp); });

    function mouseMove(e) { moveInput(e.clientX, e.clientY); }
    function mouseUp() { endInput(); document.removeEventListener('mousemove', mouseMove); document.removeEventListener('mouseup', mouseUp); }

    updatePlayerPosition();
  </script>
</body>
</html>
